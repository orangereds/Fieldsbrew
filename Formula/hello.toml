[package]
name = "hello"
version = "2.12.1"
description = "GNU Hello，经典的 hello world 示例程序"
homepage = "https://www.gnu.org/software/hello/"
dependencies = []

[source]
url = "https://ftp.gnu.org/gnu/hello/hello-2.12.1.tar.gz"
sha256 = "8d99142afd92576f30b0cd7cb42a8dc6809998bc5d607d88761f512e26c7db20"

[build]
system = "autotools"

# macOS CLT 下 iconv 不在默认链接路径，autoconf 的标准 LIBS 变量可注入
[build.env]
LIBS = "-liconv"

[install]
keg_only = false
