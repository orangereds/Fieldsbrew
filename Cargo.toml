[package]
name = "fieldsbrew"
version = "0.1.0"
edition = "2021"
description = "Intel Mac 专用 macOS 包管理器，灵感来自 MacPorts 与 Homebrew"

[[bin]]
name = "fb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ureq = "2"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rs = "0.3"
bzip2-rs = "0.1"
ed25519-dalek = "2"

[profile.release]
strip = true
lto = true
